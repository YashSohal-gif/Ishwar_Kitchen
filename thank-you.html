<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>Thank You – Ishwar Kitchen</title>
  
  <meta name="theme-color" content="#D4AF37"/>
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png"/>
  <link rel="stylesheet" href="style.css"/>
  
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0a0a0a; /* Black background */
      color: #f5f5f5; /* Light text */
      text-align: center;
      padding: 1rem;
    }
    .thank-you-box {
      background: #1a1a1a; /* Dark card background */
      padding: 3rem;
      border-radius: var(--radius);
      border: 1px solid #333333;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      max-width: 500px;
      width: 100%;
    }
    .thank-you-box h1 {
      color: var(--gold, #D4AF37);
      font-size: 2.5rem;
      margin-bottom: 1rem;
      font-family: 'Playfair Display', serif;
    }
    .thank-you-box p {
      font-size: 1.1rem;
      color: #bbbbbb;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .icon-success {
      font-size: 4rem;
      margin-bottom: 1rem;
      display: inline-block;
    }
  </style>
</head>
<body>
  
  <div class="thank-you-box">
    <div class="icon-success">✨</div>
    <h1>Thank You!</h1>
    <p>Your review has been successfully submitted. We truly appreciate your feedback and hope to serve you again soon at Ishwar Kitchen!</p>
    <a href="index.html" class="btn btn-primary">← Back to Home</a>
  </div>

</body>
</html>
